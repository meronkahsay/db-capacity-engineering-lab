name: ci

# =============================================================================
# Calls the group platform's reusable golden-ci.yml (gitleaks -> trivy config
# -> zizmor -> docker build -> trivy image -> tag AMI -> tflocal apply).
# Pinned to the same regional-health-platform commit as terraform/main.tf's
# module sources — keep both refs in sync when bumping.
#
# run_apply is false on every PR (scan gates only — no LOCALSTACK_AUTH_TOKEN
# needed for a PR from outside this repo) and true only on push to main,
# matching the group workflow's own documented run_apply convention.
# =============================================================================

# C5 red-PR (zizmor): the explicit `permissions: contents: read` block that
# normally lives here has been deliberately removed to prove the zizmor gate
# catches excessive-permissions (GitHub defaults GITHUB_TOKEN to broad
# read/write without it). The follow-up commit restores it and shows CI
# green again.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    # Pinned to the same regional-health-platform commit as
    # terraform/main.tf's platform_ref local -- keep both in sync when
    # bumping either one.
    uses: nebyathhailu/regional-health-platform/.github/workflows/golden-ci.yml@3cab12d1d9e749e30b0627c52ecfe00efb14e1de
    with:
      app_dir: api
      image_name: capacity-api
      terraform_dir: terraform
      run_apply: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      localstack_auth_token: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
      aiven_host: ${{ secrets.AIVEN_HOST }}
      aiven_port: ${{ secrets.AIVEN_PORT }}
      aiven_password: ${{ secrets.AIVEN_PASSWORD }}
